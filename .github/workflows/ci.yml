name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 同一分支的重复推送取消旧运行，节省算力
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      # 代码质量/风格门禁（eslint flat config, 0 errors 才通过）
      - name: Lint (eslint .)
        run: npm run lint

      # i18n 扫描门禁：strict 模式, 全量无硬编码中文残留才通过
      - name: i18n check (strict)
        run: npm run i18n:check:strict

      # 覆盖率门禁：vitest v8 provider, 80% 阈值未达标则非零退出
      # 注：Linux 路径大小写一致, 无 Windows 本地盘符重复误报, 80% 门禁正常生效
      - name: Test + coverage gate (80%)
        run: npm run test:coverage

      # 构建门禁：vue-tsc 类型检查 + vite 生产构建
      - name: Build (typecheck + vite build)
        run: npm run build

      # 持久化覆盖率报告供人工查看（不影响门禁结果）
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # E2E 门禁（已纳入默认门禁）: Playwright 真实浏览器跑 e2e/ 下 6 个 spec
  # - 本地 Windows 用系统 Edge(channel: msedge, 免下载); CI(ubuntu) 自动切自带 chromium + --with-deps
  # - playwright.config.ts 在 CI 下切 chromium 分支, 避免 Linux 无系统 Edge 而报错
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Tauri 桌面构建门禁（P2-#1 已纳入默认门禁）
  # - 验证桌面端 release 二进制可编译（--no-bundle：Linux runner 无法构建 tauri.conf.json 的
  #   msi/nsis/app 目标，且 CI 无签名密钥，故仅做编译验证并上传二进制 artifact）
  # - 正式发布（Windows/macOS 安装包 + 代码签名）需在仓库 Secrets 配置
  #   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD / 代码签名证书，
  #   然后启用下方注释的 tauri-release job（tauri-apps/tauri-action）
  tauri-build:
    name: Tauri Build (desktop binary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Tauri v2 Linux 构建依赖（webkit2gtk-4.1 等）
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Tauri build (--no-bundle)
        run: npm run tauri:build -- --no-bundle

      - name: Upload desktop binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-binary
          path: src-tauri/target/release/ai-roleplay
          retention-days: 7

  # 正式发布（签名安装包）— ② CI 的深化闭环
  # 启用前需在仓库 Secrets 配置：
  #   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD（Tauri 更新签名，必需）
  #   WINDOWS_CERT_BASE64 / WINDOWS_CERT_PASSWORD（Windows 代码签名证书，可选；未配则出未签名 msi/nsis）
  # 仅在打 tag（v*）或手动 workflow_dispatch 时触发，不接入日常 push/PR，避免污染主门禁；
  # Secrets 缺失时该 job 会被 if 条件跳过（日常流程零影响）
  tauri-release:
    name: Tauri Release (signed installers)
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs: [quality-gates, e2e]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (npm ci)
        run: npm ci

      # Windows 代码签名（可选）：Secrets 配置 WINDOWS_CERT_BASE64 / WINDOWS_CERT_PASSWORD 后，
      # 取消注释还原 .pfx 供 tauri-action 读取 CSC_LINK / CSC_KEY_PASSWORD；未配置则跳过
      # - name: Restore Windows code-signing cert
      #   if: ${{ runner.os == 'Windows' }}
      #   shell: bash
      #   env:
      #     WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      #     WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      #   run: |
      #     echo "$WINDOWS_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.pfx"

      - name: Build & release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI 酒馆 ${{ github.ref_name }}'
          releaseBody: 'Automated release — see assets to download and install.'
          prerelease: false
          args: ${{ matrix.args }}
