name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # 手动触发只运行质量门禁；GitHub Release 保留自动生成的源码归档。
  # 2026-10-03 移除 on.push.tags: ['v*']：回填 v0.4.0–v1.0.0 七个标签实测未触发
  # 任何运行，该触发器既不生效又留着误触发白跑的风险。发布产物一律不上传。
  workflow_dispatch:

# 同一分支的重复推送取消旧运行，节省算力
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    # 覆盖率门禁需要真实 PostgreSQL：Runtime 集成测试在缺少 RUNTIME_PG_TEST_URL 时会跳过，
    # 被跳过的模块会被 v8 计为 0% 覆盖，导致 statements 低于 78% 阈值而误判失败。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: runtime_test
          POSTGRES_DB: runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      # 依赖漏洞门禁（P1-6）：只拦 high 及以上，避免 dev-only 的 moderate 阻塞发布。
      # 历史教训：08-20 为绕 vitest collector bug 降版，使 npm audit 从 0 项静默
      # 漂移到 4 项（1 high + 3 moderate）而无人察觉 —— 该门禁即为此而设。
      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high

      # 代码质量/风格门禁（eslint flat config, 0 errors 才通过）
      - name: Lint (eslint .)
        run: npm run lint

      # Runtime Schema 漂移门禁：迁移文件必须与权威 Schema 文档逐字一致
      - name: Runtime schema drift check
        run: npm run runtime:db:schema:check

      # 快照迁移计划自洽门禁：各存储域的迁移步骤与版本契约必须自洽。
      # 此前只在本地证据包（release:pack）里执行，CI 无护栏 —— 2026-10-03 补。
      - name: Snapshot migration plan check
        run: npm run snapshot:migration:check

      # i18n 扫描门禁：strict 模式, 全量无硬编码中文残留才通过
      - name: i18n check (strict)
        run: npm run i18n:check:strict

      # 评测判定链离线自检（EVAL-01/02/03）：断言事实覆盖数与合规率阈值，
      # 防判定链静默退化。不联网、不调用真实 Provider（真实一致率属 requires-real-env）。
      - name: Eval manifest self-check (strict)
        run: npm run eval:manifest

      # CSS 约定守卫（单一入口，编排 5 项子检查，任一项失败即整体失败）：
      #   1. 断点单一来源（S-10）—— 禁止野断点数字、禁止 matchMedia 出现在 viewport.ts 外、L1/L4 数值同步
      #   2. 动态视口（S-8）—— 禁止裸 100vh（须 100vh + 100dvh 双写），防 iOS 动态视口工具条遮挡
      #   3. 触屏 hover（I-5 / P2-5）—— 禁止未按 (hover: hover) and (pointer: fine) 分流的 :hover
      #   4. !important 棘轮（S-1 / P2-4）—— 存量基线锁定，只许降不许升
      #   5. 可编辑控件字号（I-7）—— 移动断点内 input/textarea/select 须有 ≥16px 兜底，防 iOS 聚焦放大
      # 各子检查仍可单独运行：npm run check:breakpoints / check:viewport / check:hover /
      # check:important / check:i7-control-font-size
      - name: CSS conventions guard (check:css-conventions)
        run: npm run check:css-conventions

      # 单文件行数棘轮（DEV_PLAN §7 大文件拆分专项的配套门禁）：白名单锁"登记行数"，
      # 只许降不许升。没有这条，§7 拆完的 92 个文件半年后会重新长回去，那 20–30 人日
      # 就白花了。新增 >1000 行的文件会被拦下：要么拆开，要么在白名单登记并写明理由。
      - name: File size guard (check:file-size)
        run: npm run check:file-size

      # 存盘方式守卫（2026-10-14 安卓模拟器实测立）：blob + `<a download>` 在 Capacitor 的
      # WebView 里静默无效（不报错、无下载记录、全盘搜不到文件），所以存盘必须走 utils/save-blob.ts。
      # 基线已清零（2026-10-15 实测：存量 0 处 / 基线 0 处，9 处导出全部改走 saveBlob），
      # 所以这里加一处就红，不再是"只许降不许升"。
      - name: Save-blob guard (check:save-blob)
        run: npm run check:save-blob
      - name: Save-blob guard self-test
        run: npm run check:save-blob:self-test

      # 产物入库守卫（2026-10-16 立）：出包脚本会把约 27MB 的 debug APK 放进仓库根 installer/，
      # 而公开仓库的 git 历史收下大文件之后删掉记录也不会瘦。分发改走 GitHub Releases。
      # .gitignore 挡"顺手 add"，这一条挡"已经 add 了"：按扩展名 + 1MB 体积上限扫已跟踪文件。
      # 实测当前 1034 个跟踪文件无一命中（最大 418KB），所以门禁上线即是绿的。
      - name: No-artifact-in-git guard (check:no-artifact)
        run: npm run check:no-artifact
      - name: No-artifact-in-git guard self-test
        run: npm run check:no-artifact:self-test

      # Token 死引用棘轮（M18 试点 → M19 入门禁）：组件层裸引用一个没定义的 CSS 变量时，
      # 浏览器会把整条声明丢掉 —— 今天就是失效代码，不是风格问题。实测存量 74 处 / 4 文件
      # （StoryEngineView 独占 55），属 M21 要逐条映射的遗留，所以按 !important 棘轮同一套路：
      # **按文件锁**基线，只许减不许增。只锁总数会被"这里减 5、那里加 5"抵消成平局（探针实测过）。
      - name: Token dead-reference ratchet (check:token-baseline)
        run: npm run check:token-baseline

      # 上一条棘轮的自测：用合成夹具跑同一份扫描代码，钉住三类已被实测到的判定边界
      # （运行时 setProperty 注入的键不算违规、src/styles 的 hex 是调色板不是绕过、带兜底归 B 类），
      # 以及"总数抵消仍须红"。防死门禁 —— 2026-10-07 的对比度门禁就是硬编码后与代码脱钩永远绿灯。
      # 破坏性验证（2026-10-11 实跑）：把运行时白名单去掉 / 把 styles 混进 A 类 / 棘轮退化成只看总数，
      # 三种改写都让本步骤变红，对应断言逐条点名。
      - name: Token guard self-test
        run: npm run token:self-test

      # 无障碍对比度门禁（P1-2 重构）：不再硬编码色值，改为
      #   A) 读 tokens.css/themes.css 真实变量，递归解析 var() 与 color-mix()
      #   B) 扫描 src/ 下实际出现的 color × background 配对（含同色染层合成）
      # A 部分（语义配对）硬卡 AA；B 部分为存量棘轮（基线见脚本 BASELINE_SCAN_FAILURES，只许降不许升）
      # （axe 在 jsdom 无法计算颜色对比度, 故由 check-contrast.mjs 单独校验; axe 的 ARIA/语义规则已并入 test:coverage）
      - name: Contrast audit (a11y:contrast)
        run: npm run a11y:contrast

      # 门禁自测：构造正/负样本，确认门禁本身能区分达标与不达标
      # （防「永远绿灯」的死门禁 —— 旧版正因硬编码色值而与实际代码脱钩）
      - name: Contrast guard self-test
        run: npm run a11y:contrast:self-test

      # 覆盖率门禁：vitest v8 provider，阈值定义在 vitest.config.ts
      # （statements 78 / branches 73 / functions 78 / lines 78），未达标则非零退出
      # 注：Linux 路径大小写一致, 无 Windows 本地盘符重复误报, 门禁正常生效
      # 注：本步骤同时承载真实 PostgreSQL 集成测试（见上方 service 与 env），
      #     不再单设重复 job，避免同一批集成用例执行两次。
      - name: Test + coverage gate (78/73/78/78)
        env:
          RUNTIME_PG_TEST_URL: postgresql://postgres:runtime_test@127.0.0.1:5432/runtime_test
          RUNTIME_PG_APPLY_SCHEMA: '1'
        run: npm run test:coverage

      # 构建门禁：vue-tsc 类型检查 + vite 生产构建
      - name: Build (typecheck + vite build)
        run: npm run build

      # Web 端 CSP 契约守卫（P0-2）：校验构建产物含 CSP meta、关键指令齐备、
      # script-src 未被 unsafe-eval/unsafe-inline 削弱、无内联 script。必须在 Build 之后。
      - name: CSP guard (check:csp)
        run: npm run check:csp

      # ORT 首屏隔离守卫（第二轮 O-1 的回归护栏）：断言构建产物、入口静态可达依赖图与
      # index.html 均不含 onnxruntime，且 public/vendor/ort 与 node_modules 版本一致。
      # 该门禁此前只在本地证据包执行，CI 无护栏 —— 2026-10-03 补。必须在 Build 之后。
      - name: ORT first-screen guard (check:ort)
        run: npm run check:ort

      # 持久化覆盖率报告供人工查看（不影响门禁结果）
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # E2E 门禁（已纳入默认门禁）: Playwright 真实浏览器跑 e2e/ 下全部 spec
  # - 三个 project：桌面功能（chromium/Edge）、移动端布局与核心功能（Pixel 5 视口）、WebKit（Safari 近似内核）
  # - 本地 Windows 用系统 Edge（免下载）+ 需 `npx playwright install webkit`；CI 安装 chromium + webkit
  # - M16-c：四片改成**按实测时长分组**，不再用 `--shard=i/4`。
  #   `--shard` 只按用例条数切、不看每条跑多久。2026-10-11 用单 worker 全量实测（177 条 / 34 个 spec）
  #   给每条用例的时长按文件汇总，`--shard` 切出来四片是 507s / 390s / 515s / 156s（最慢片是最快片的
  #   3.31 倍），整套墙钟由最慢那片决定、其余三台机器提前空闲。按时长贪心均衡后是
  #   165s / 165s / 166s / 165s（极差 1.006 倍）。
  #   清单由 scripts/e2e-shard-groups.mjs 从那份跑数生成到 e2e/shard-groups.mjs，CI 按组取文件列表；
  #   tests/tooling/e2e-shard-groups.test.ts 守住"每个 spec 恰好属于一组"——清单是生成的就可能漏，
  #   漏掉的那条在 CI 上静默不跑，比慢一点严重得多（生成器最早把 project 名写成 \w+，
  #   整个移动 project 没进权重，两个 mobile spec 因此落空，正是这条断言抓到的）。
  # - 分片墙钟的历史实测（M12-c，`--shard` 时期）：单 worker 串行 42/42/49/34 条 = 2.3/1.3/3.2/1.7 分钟。
  #   当时那个"并发几乎没换来时间"的结论仍然成立：CI 维持 1 worker（`workers: isCI ? 1 : 4`），
  #   确定性优先，压墙钟的正路是分片而不是调并发。
  # - `fail-fast: false`：一片红不影响其余三片跑完，否则一次红就看不到另外三片的证据。
  e2e:
    name: E2E (Playwright) group ${{ matrix.group }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      # 双内核：chromium 覆盖桌面 + Pixel 5 视口；webkit 覆盖 Safari 近似内核
      - name: Install Playwright browsers (chromium + webkit)
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests (weight-balanced group ${{ matrix.group }}/4)
        run: |
          # 文件清单来自 e2e/shard-groups.mjs（scripts/e2e-shard-groups.mjs 按实测时长生成）
          FILES=$(node scripts/e2e-shard-groups.mjs --group=${{ matrix.group }})
          echo "本组文件：$FILES"
          npm run test:e2e -- $FILES

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # artifact 名必须逐片唯一（actions/upload-artifact@v4 同名会直接报错）
          name: playwright-report-group-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Tauri 桌面构建门禁（P2-#1 已纳入默认门禁）
  # - 验证桌面端 release 二进制可编译（--no-bundle：不生成或上传任何安装包）
  # - GitHub 发布不构建或上传安装包；tag 对应的 Release 只保留源码归档
  tauri-build:
    name: Tauri Build (desktop binary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Tauri v2 Linux 构建依赖（webkit2gtk-4.1 等）
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Tauri build (--no-bundle)
        run: npm run tauri:build -- --no-bundle
