name: CI

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  # 手动触发（P1-4 修复）：使 tauri-release 的 `workflow_dispatch` 分支可达。
  # 注意：手动触发时 github.ref_name 为分支名，tauri-action 会以该名称建 release/tag，
  # 故「产出签名安装包」的手动入口应配合 tag 使用；日常只用于按需重跑门禁。
  workflow_dispatch:

# 同一分支的重复推送取消旧运行，节省算力
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      # 依赖漏洞门禁（P1-6）：只拦 high 及以上，避免 dev-only 的 moderate 阻塞发布。
      # 历史教训：08-20 为绕 vitest collector bug 降版，使 npm audit 从 0 项静默
      # 漂移到 4 项（1 high + 3 moderate）而无人察觉 —— 该门禁即为此而设。
      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high

      # 代码质量/风格门禁（eslint flat config, 0 errors 才通过）
      - name: Lint (eslint .)
        run: npm run lint

      # Runtime Schema 漂移门禁：迁移文件必须与权威 Schema 文档逐字一致
      - name: Runtime schema drift check
        run: npm run runtime:db:schema:check

      # i18n 扫描门禁：strict 模式, 全量无硬编码中文残留才通过
      - name: i18n check (strict)
        run: npm run i18n:check:strict

      # CSS 约定守卫（单一入口，编排 5 项子检查，任一项失败即整体失败）：
      #   1. 断点单一来源（S-10）—— 禁止野断点数字、禁止 matchMedia 出现在 viewport.ts 外、L1/L4 数值同步
      #   2. 动态视口（S-8）—— 禁止裸 100vh（须 100vh + 100dvh 双写），防 iOS 动态视口工具条遮挡
      #   3. 触屏 hover（I-5 / P2-5）—— 禁止未按 (hover: hover) and (pointer: fine) 分流的 :hover
      #   4. !important 棘轮（S-1 / P2-4）—— 存量基线锁定，只许降不许升
      #   5. 可编辑控件字号（I-7）—— 移动断点内 input/textarea/select 须有 ≥16px 兜底，防 iOS 聚焦放大
      # 各子检查仍可单独运行：npm run check:breakpoints / check:viewport / check:hover /
      # check:important / check:i7-control-font-size
      - name: CSS conventions guard (check:css-conventions)
        run: npm run check:css-conventions

      # 无障碍对比度门禁（P1-2 重构）：不再硬编码色值，改为
      #   A) 读 tokens.css/themes.css 真实变量，递归解析 var() 与 color-mix()
      #   B) 扫描 src/ 下实际出现的 color × background 配对（含同色染层合成）
      # A 部分（语义配对）硬卡 AA；B 部分为存量棘轮（基线见脚本 BASELINE_SCAN_FAILURES，只许降不许升）
      # （axe 在 jsdom 无法计算颜色对比度, 故由 check-contrast.mjs 单独校验; axe 的 ARIA/语义规则已并入 test:coverage）
      - name: Contrast audit (a11y:contrast)
        run: npm run a11y:contrast

      # 门禁自测：构造正/负样本，确认门禁本身能区分达标与不达标
      # （防「永远绿灯」的死门禁 —— 旧版正因硬编码色值而与实际代码脱钩）
      - name: Contrast guard self-test
        run: npm run a11y:contrast:self-test

      # 覆盖率门禁：vitest v8 provider，阈值定义在 vitest.config.ts
      # （statements 78 / branches 73 / functions 78 / lines 78），未达标则非零退出
      # 注：Linux 路径大小写一致, 无 Windows 本地盘符重复误报, 门禁正常生效
      - name: Test + coverage gate (78/73/78/78)
        run: npm run test:coverage

      # 构建门禁：vue-tsc 类型检查 + vite 生产构建
      - name: Build (typecheck + vite build)
        run: npm run build

      # Web 端 CSP 契约守卫（P0-2）：校验构建产物含 CSP meta、关键指令齐备、
      # script-src 未被 unsafe-eval/unsafe-inline 削弱、无内联 script。必须在 Build 之后。
      - name: CSP guard (check:csp)
        run: npm run check:csp

      # 持久化覆盖率报告供人工查看（不影响门禁结果）
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # E2E 门禁（已纳入默认门禁）: Playwright 真实浏览器跑 e2e/ 下 6 个 spec
  # - 本地 Windows 用系统 Edge(channel: msedge, 免下载); CI(ubuntu) 自动切自带 chromium + --with-deps
  # - playwright.config.ts 在 CI 下切 chromium 分支, 避免 Linux 无系统 Edge 而报错
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Tauri 桌面构建门禁（P2-#1 已纳入默认门禁）
  # - 验证桌面端 release 二进制可编译（--no-bundle：Linux runner 无法构建 tauri.conf.json 的
  #   msi/nsis/app 目标，且 CI 无签名密钥，故仅做编译验证并上传二进制 artifact）
  # - 正式发布（Windows/macOS 安装包 + 代码签名）需在仓库 Secrets 配置
  #   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD / 代码签名证书，
  #   然后启用下方注释的 tauri-release job（tauri-apps/tauri-action）
  tauri-build:
    name: Tauri Build (desktop binary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Tauri v2 Linux 构建依赖（webkit2gtk-4.1 等）
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Tauri build (--no-bundle)
        run: npm run tauri:build -- --no-bundle

      - name: Upload desktop binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-binary
          path: src-tauri/target/release/ai-roleplay
          retention-days: 7

  # 正式发布（签名安装包）— ② CI 的深化闭环
  # 启用前需在仓库 Secrets 配置：
  #   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD（Tauri 更新签名，必需）
  #   WINDOWS_CERT_BASE64 / WINDOWS_CERT_PASSWORD（Windows 代码签名证书，可选；未配则出未签名 msi/nsis）
  # 仅在打 tag（v*）或手动 workflow_dispatch 时触发，不接入日常 push/PR，避免污染主门禁；
  # Secrets 缺失时该 job 会被 if 条件跳过（日常流程零影响）
  tauri-release:
    name: Tauri Release (signed installers)
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs: [quality-gates, e2e]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 签名 Secrets 显式校验：缺失即 fail（避免静默产出的未签名包 + 缺失 latest.json）
      - name: Verify signing secrets configured
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD 未配置。请在 Settings > Secrets > Actions 添加后再重新发布。"
            exit 1
          fi
          echo "::notice::签名 Secrets 已配置, 将生成签名安装包与 latest.json"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (npm ci)
        run: npm ci

      # Windows 代码签名（可选）：Secrets 配置 WINDOWS_CERT_BASE64 / WINDOWS_CERT_PASSWORD 后，
      # 取消注释还原 .pfx 供 tauri-action 读取 CSC_LINK / CSC_KEY_PASSWORD；未配置则跳过
      # - name: Restore Windows code-signing cert
      #   if: ${{ runner.os == 'Windows' }}
      #   shell: bash
      #   env:
      #     WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      #     WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      #   run: |
      #     echo "$WINDOWS_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.pfx"

      - name: Build & release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI 酒馆 ${{ github.ref_name }}'
          releaseBody: 'Automated release — see assets to download and install.'
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
